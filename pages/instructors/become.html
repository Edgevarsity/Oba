<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become an Instructor | Kotech</title>
    <link rel="stylesheet" href="/assets/css/become.css">
</head>
<body>
    <h1>Become a Kotech Instructor</h1>

    <form action="instructor-success.html" method="get">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" required>

        <label for="age">Age</label>
        <input id="age" name="age" type="number" min="18" required>

        <label for="experience">Years of experience</label>
        <input id="experience" name="experience" type="number" min="0">

        <label for="course">Course you want to teach</label>
        <input id="course" name="course" type="text" required>

        <button type="submit">
            <a href="/pages/instructors/instructor-success.html">Submit application</a>
        </button>
    </form>
</body>
</html
